<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Gym Program Builder</title>
  <link rel="stylesheet" href="style.css">
  <script type="module" src="src/app.js"></script>
</head>
<body>
  <main class="layout">
    <section class="builder">
      <h1>Session builder</h1>
      <label class="field">
        Session name
        <input id="session-name" type="text" placeholder="e.g. Push day">
      </label>
      <p id="session-name-error" class="error"></p>

      <ol id="exercises" class="exercises"></ol>
      <button id="add-exercise" type="button">Add exercise</button>
    </section>

    <aside class="panel">
      <h2>Volume (sets)</h2>
      <table>
        <thead><tr><th>Muscle group</th><th>Sets</th></tr></thead>
        <tbody id="volume"></tbody>
      </table>
    </aside>
  </main>
</body>
</html>
