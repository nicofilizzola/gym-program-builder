<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="color-scheme" content="dark">
<title>Gym Program Builder</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap">
<link rel="stylesheet" href="style.css"><script type="module" src="src/app.js"></script>
</head>
<body>
<div id="auth" hidden></div>
<div id="shell" hidden>
<header class="app-header"><span class="app-brand">Gym Program Builder</span><nav aria-label="Main"><a href="#/programs" data-nav="programs">Programs</a><a href="#/templates" data-nav="templates">Session templates</a><a href="#/catalog" data-nav="catalog">Exercise catalog</a></nav><div class="save-controls"><span data-testid="save-status" role="status" aria-live="polite"></span><button id="retry-save" class="secondary-btn" hidden>Retry</button><button id="reload-saved" class="secondary-btn" hidden>Reload saved version</button><button id="copy-saved" class="secondary-btn" hidden>Save as copy</button><button id="profile" class="action-button" aria-label="Profile" data-action-tooltip="Profile"></button><button id="logout" class="action-button" aria-label="Log out" data-action-tooltip="Log out"></button></div></header>
<p id="app-message" class="error app-message" role="alert"></p><div class="app-message"><button id="retry-creation" class="secondary-btn" hidden>Retry creation</button></div><p id="navigation-status" class="navigation-status" role="status" aria-live="polite" hidden>Opening?</p><div id="app" aria-busy="false"></div>
</div>
</body></html>
